<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600;1,700&family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--red:#7A1712;--dark:#3B0A08;--green:#1F4A2C;--cream:#F7EFE2;--paper:#FBF6EE;--ink:#2B1B17;--muted:#5A463E;--en:#6A564D;--line:#E3D3BF}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Tajawal',sans-serif;-webkit-font-smoothing:antialiased}
.it{font-family:'Playfair Display',serif;font-style:italic}
.ms{font-family:'El Messiri',sans-serif}
a{color:inherit}
/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:50;background:var(--red);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;overflow:hidden;transition:transform .9s cubic-bezier(.7,0,.2,1),opacity .9s}
#intro.out{transform:translateY(-100%)}
#intro .ring{position:absolute;border-radius:50%;border:1px solid rgba(247,239,226,.18);animation:pulse 3.2s ease-out infinite}
#intro .r1{width:420px;height:420px;animation-delay:0s}#intro .r2{width:620px;height:620px;animation-delay:.6s}#intro .r3{width:860px;height:860px;animation-delay:1.2s}
@keyframes pulse{0%{transform:scale(.85);opacity:0}30%{opacity:1}100%{transform:scale(1.15);opacity:0}}
.steam{position:relative;width:120px;height:70px;margin-bottom:-28px}
.steam span{position:absolute;bottom:0;width:6px;height:46px;border-radius:6px;background:linear-gradient(to top,rgba(247,239,226,.0),rgba(247,239,226,.65),rgba(247,239,226,0));filter:blur(2px);animation:steam 2.4s ease-in-out infinite;opacity:0}
.steam span:nth-child(1){left:38px}.steam span:nth-child(2){left:57px;animation-delay:.5s}.steam span:nth-child(3){left:76px;animation-delay:1s}
@keyframes steam{0%{transform:translateY(10px) scaleY(.6);opacity:0}40%{opacity:.9}100%{transform:translateY(-34px) scaleY(1.2);opacity:0}}
#intro .lg{width:210px;opacity:0;transform:scale(.9);animation:logoIn 1s .2s forwards}
.hero .wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;display:flex;align-items:stretch;justify-content:space-between;gap:24px}
.hero .txt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero .show{flex:1;align-self:stretch;position:relative;min-height:380px;overflow:hidden;-webkit-mask-image:radial-gradient(closest-side,#000 62%,transparent 100%);mask-image:radial-gradient(closest-side,#000 62%,transparent 100%)}
.dish{position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px 0 0 -115px;opacity:0;animation:pass 4.2s cubic-bezier(.45,.05,.25,1) forwards;will-change:transform,opacity}
.dish img{width:100%;height:100%;object-fit:contain;display:block;animation:spin 9s linear infinite}
.dish.pasta img{border-radius:50%}
.dish::after{content:"";position:absolute;left:12%;right:12%;bottom:-6%;height:12%;border-radius:50%;background:rgba(0,0,0,.28);filter:blur(10px);z-index:-1}
@keyframes pass{0%{transform:translate(-190%,120%) scale(.55) rotate(-140deg);opacity:0}
22%{opacity:1}
32%{transform:translate(0,0) scale(1) rotate(0deg);opacity:1}
68%{transform:translate(0,0) scale(1) rotate(25deg);opacity:1}
88%{opacity:.6}
100%{transform:translate(190%,-120%) scale(.55) rotate(150deg);opacity:0}}
@media (max-width:720px){.hero .show{width:100%;min-height:300px;flex:none}.dish{width:180px;height:180px;margin:-90px 0 0 -90px}}
@media (max-width:720px){.hero .wrap{flex-direction:column}}
.stage{position:relative;width:min(76vw,340px);height:min(76vw,340px);display:flex;align-items:center;justify-content:center}
.orbit{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(247,239,226,.35);animation:spin 26s linear infinite reverse}
.orbit img{position:absolute;width:20%;left:40%;top:40%;}
.plate{width:66%;height:66%;border-radius:50%;background:radial-gradient(circle,#FBF6EE 0 60%,#EADBC6 61% 100%);box-shadow:0 18px 40px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.plate img{width:88%;animation:spin 9s linear infinite;transition:opacity .45s,transform .45s}
.plate img.swap{opacity:0}
@keyframes spin{to{transform:rotate(360deg)}}
.dname{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;transition:opacity .4s}
.dname.swap{opacity:0}
.dname .a{font-family:'El Messiri',sans-serif;font-weight:700;font-size:24px}
.dname .b{font-family:'Playfair Display',serif;font-style:italic;font-size:18px;color:#F3D9C2}
.dname .pr{font:700 15px 'Tajawal';background:var(--cream);color:var(--red);border-radius:999px;padding:4px 14px;margin-top:6px}
@keyframes logoIn{to{opacity:1;transform:none}}
.words{position:relative;height:120px;width:100%}
.word{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;opacity:0;transform:translateY(16px)}
.word .a{font-family:'El Messiri',sans-serif;font-weight:700;font-size:34px}
.word .b{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;font-size:26px;color:#F3D9C2}
.w1{animation:wordIn .7s .9s forwards,wordOut .6s 2.6s forwards}
.w2{animation:wordIn .7s 3.1s forwards}
@keyframes wordIn{to{opacity:1;transform:none}}
@keyframes wordOut{to{opacity:0;transform:translateY(-16px)}}
.flag{display:flex;border-radius:3px;overflow:hidden}.flag i{display:block;width:26px;height:5px}
.flag i:nth-child(1){background:var(--green)}.flag i:nth-child(2){background:#E9DDC9}.flag i:nth-child(3){background:#C0392B}
#enter{margin-top:6px;font:700 16px 'Tajawal',sans-serif;color:var(--red);background:var(--cream);border:0;border-radius:999px;padding:14px 30px;min-height:48px;cursor:pointer;opacity:0;animation:wordIn .6s 3.6s forwards}
#intro .skip{position:absolute;top:16px;left:16px;font:500 14px 'Tajawal';color:var(--cream);background:transparent;border:1px solid rgba(247,239,226,.5);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
/* ---------- page ---------- */
header.hero{background:var(--red);color:var(--cream);text-align:center;padding:30px 20px 90px;position:relative;overflow:hidden}
header.hero::after{content:"";position:absolute;left:50%;bottom:-60px;width:140%;height:120px;transform:translateX(-50%);background:var(--paper);border-radius:50%}
header.hero .txt img{width:150px}
.hero h1{margin:10px 0 4px;font-size:30px}
.hero p{margin:0;color:#F3D9C2;font-size:15px}
.actions{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:560px;margin:-46px auto 0;padding:0 16px}
.actions a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:76px;background:#fff;border:1px solid var(--line);border-radius:18px;text-decoration:none;font-weight:700;font-size:13.5px;color:var(--ink);transition:transform .2s}
.actions a:active{transform:scale(.96)}
.actions svg{width:24px;height:24px;stroke:var(--red)}
nav.cats{position:sticky;top:0;z-index:10;background:rgba(251,246,238,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-top:22px}
nav.cats .wrap{position:relative;max-width:760px;margin:0 auto}
nav.cats .in{display:flex;gap:8px;overflow-x:auto;padding:12px 52px;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;cursor:grab;user-select:none}
nav.cats .in.drag{cursor:grabbing}nav.cats .in.drag a{pointer-events:none}
nav.cats .arr{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--red);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;box-shadow:0 2px 8px rgba(59,10,8,.12);transition:opacity .2s}
nav.cats .arr[disabled]{opacity:0;pointer-events:none}
nav.cats .arr.r{right:6px}nav.cats .arr.l{left:6px}
nav.cats .wrap::before,nav.cats .wrap::after{content:'';position:absolute;top:0;bottom:0;width:56px;z-index:1;pointer-events:none}
nav.cats .wrap::before{right:0;background:linear-gradient(to left,rgba(251,246,238,1),rgba(251,246,238,0))}
nav.cats .wrap::after{left:0;background:linear-gradient(to right,rgba(251,246,238,1),rgba(251,246,238,0))}
nav.cats .in::-webkit-scrollbar{display:none}
nav.cats a{flex:none;text-decoration:none;font:700 14.5px 'Tajawal';padding:10px 16px;min-height:42px;display:flex;align-items:center;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);transition:background .25s,color .25s}
nav.cats a.on{background:var(--red);color:var(--cream);border-color:var(--red)}
main{max-width:760px;margin:0 auto;padding:8px 16px 40px}
section{padding-top:26px;scroll-margin-top:70px}
.sh{text-align:center;margin-bottom:16px;display:flex;flex-direction:column;align-items:center;gap:4px}
.sh .it{font-size:34px;color:var(--red);line-height:1.1}
.sh .ms{font-size:20px;color:var(--green);font-weight:700}
.card{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px;opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}
.card.vis{opacity:1;transform:none}
.card .ph{flex:none;width:96px;height:96px;display:flex;align-items:center;justify-content:center}
.card .ph img{width:100%;height:auto;transition:transform .8s}
.card.vis .ph img{animation:spinIn 1s ease-out}
@keyframes spinIn{from{transform:rotate(-60deg) scale(.8)}to{transform:none}}
.card .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.top{display:flex;align-items:center;gap:10px}
.top .n{font-family:'El Messiri',sans-serif;font-weight:700;font-size:19px}
.top .dots{flex:1;border-bottom:2px dotted #D7C3AC;transform:translateY(4px)}
.price{flex:none;min-width:46px;height:46px;padding:0 6px;border-radius:999px;background:var(--green);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.price b{font:700 18px 'El Messiri'}.price small{font-size:9.5px;opacity:.85;margin-top:1px}
.la{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;font-size:15.5px;color:var(--red)}
.ia{font-size:15px;line-height:1.6;color:var(--muted)}
.kc{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;margin-top:4px;font-size:12.5px;font-weight:700;color:#9A4A12;background:#FBEBDD;border-radius:999px;padding:3px 10px}
.kc svg{width:13px;height:13px}
.ie{direction:ltr;text-align:right;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--en);line-height:1.5}
.list{background:#fff;border:1px solid var(--line);border-radius:22px;padding:6px 16px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F0E5D6;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
.row.vis{opacity:1;transform:none}
.row:last-child{border-bottom:0}
.row .n{font-family:'El Messiri',sans-serif;font-weight:700;font-size:18px}
.row .w{font-size:12.5px;color:var(--en)}
footer{background:var(--red);color:var(--cream);text-align:center;padding:38px 20px 46px;border-radius:40px 40px 0 0}
footer .big{font-size:28px;margin:0}
footer .it{font-size:22px;color:#F3D9C2}
footer p{margin:8px 0;font-size:15px}
footer a{color:var(--cream)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card,.row{opacity:1;transform:none}#intro .word{opacity:1;transform:none}.w1{display:none}#intro img,#enter{opacity:1}}
</style>
</head>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const chips=document.getElementById('chips'),menu=document.getElementById('menu');
DATA.forEach(c=>{
  const a=document.createElement('a');a.href='#'+c.id;a.textContent=c.ar;a.dataset.id=c.id;chips.appendChild(a);

// reveal on scroll
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.card,.row').forEach(el=>io.observe(el));
// active chip
const chipFor=id=>chips.querySelector(`[data-id="${id}"]`);
const so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){chips.querySelectorAll('a').forEach(a=>a.classList.remove('on'));const c=chipFor(e.target.id);c.classList.add('on');if(!dragging){const r=c.getBoundingClientRect(),p=chips.getBoundingClientRect();chips.scrollBy({left:(r.left+r.width/2)-(p.left+p.width/2),behavior:'smooth'})}}}),{rootMargin:'-40% 0px -55% 0px'});
document.querySelectorAll('main section').forEach(s=>so.observe(s));
// drag-to-scroll + arrows for category chips
let dragging=false,sx=0,sl=0,moved=0;
chips.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;dragging=true;moved=0;sx=e.clientX;sl=chips.scrollLeft;chips.setPointerCapture(e.pointerId)});
chips.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-sx;moved=Math.max(moved,Math.abs(dx));if(moved>4)chips.classList.add('drag');chips.scrollLeft=sl-dx});
const endDrag=()=>{dragging=false;setTimeout(()=>chips.classList.remove('drag'),0)};
chips.addEventListener('pointerup',endDrag);chips.addEventListener('pointercancel',endDrag);
chips.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){chips.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
const prev=document.getElementById('prev'),next=document.getElementById('next');
prev.onclick=()=>chips.scrollBy({left:240,behavior:'smooth'});
next.onclick=()=>chips.scrollBy({left:-240,behavior:'smooth'});
function arrows(){const max=chips.scrollWidth-chips.clientWidth;const x=Math.abs(chips.scrollLeft);prev.disabled=x<4;next.disabled=x>max-4||max<=0}
chips.addEventListener('scroll',arrows,{passive:true});window.addEventListener('resize',arrows);arrows();
// intro
const intro=document.getElementById('intro');let done=false;
function close(){if(done)return;done=true;intro.classList.add('out');setTimeout(()=>intro.remove(),950)}

const DISHES=DATA.slice(0,2).flatMap(c=>c.items).filter(i=>i.img);
const PASTA=['arrabbiata','pink','truffle_penne','mushroom','alfredo'];
const SEQ=[];for(let i=0;i<Math.max(DISHES.length,PASTA.length)*2;i++){SEQ.push({src:DISHES[i%DISHES.length].img,pasta:false});SEQ.push({src:PASTA[i%PASTA.length],pasta:true});}
SEQ.forEach(x=>{const p=new Image();p.src='assets/'+x.src+'.webp'});
const show=document.getElementById('show');let si=0;
function nextDish(){const x=SEQ[si%SEQ.length];si++;const d=document.createElement('div');d.className='dish'+(x.pasta?' pasta':'');const im=document.createElement('img');im.src='assets/'+x.src+'.webp';im.alt='';d.appendChild(im);show.appendChild(d);d.addEventListener('animationend',e=>{if(e.target===d)d.remove()})}
nextDish();setInterval(nextDish,2600);
setTimeout(close,5200);
</script>
